<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeckYeah</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div id="app">
  <div class="head">
    <button id="back" class="back" style="display:none">&#8249;</button>
    <div class="brand">Heck<span>Yeah</span></div>
    <div id="headsub" class="headsub">Free media, everywhere</div>
  </div>
  <div id="updbanner" class="updbanner" style="display:none">
    <span id="updtext" class="updtext"></span>
    <button id="upddl" class="upddl">Download</button>
    <button id="updx" class="updx" aria-label="Dismiss update notice">✕</button>
  </div>
  <div id="view"><div class="loading">Loading…</div></div>
  <div class="foot">
    <button id="openapp" class="footbtn">Open full app ↗</button>
  </div>
  <div class="updfoot">
    <button id="updcheck" class="footbtn updcheck">Check for updates</button>
    <span id="updstatus" class="updstatus"></span>
  </div>
</div>
<script src="common.js"></script>
<script src="update-check.js"></script>
<script src="popup.js"></script>
</body>
</html>
